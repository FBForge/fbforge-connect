name: macOS validation
on:
  push:
    branches: ['release/0.5.0']
    paths:
      ['desktop/**', 'engine/**', 'frontend/**', 'scripts/**', 'package*.json', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require a native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: engine/**/pom.xml
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: npm ci --ignore-scripts
      - name: Real Keychain, encrypted stores and platform contracts
        run: cargo +1.99.0 test --manifest-path desktop/native-contracts/Cargo.toml --locked
      - working-directory: engine
        run: ./mvnw --batch-mode verify
      - run: npm run stage:engine
      - run: npm run test:engine
      - run: npm run build:frontend
      - name: Build the actual macOS application with its private Java runtime
        run: cargo +1.99.0 test --manifest-path desktop/Cargo.toml --locked
      - name: Bundle unsigned internal application (no signing or publication)
        run: npm run desktop:build -- --bundles app
      - name: Validate bundled runtime and architecture
        run: |
          app='desktop/target/release/bundle/macos/FBForge Connect.app'
          test -d "$app"
          file "$app/Contents/MacOS/fbforge-connect" | tee /tmp/mac-architecture.txt
          grep -q arm64 /tmp/mac-architecture.txt
          java="$app/Contents/Resources/resources/engine/runtime/bin/java"
          test -x "$java"
          "$java" -version
      - name: Preserve Unix executable bits in the candidate archive
        run: tar -czf desktop/target/release/bundle/macos/internal-macos-arm64.tar.gz -C desktop/target/release/bundle/macos "FBForge Connect.app"
      - name: Preserve internal candidate and exact source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-apple-silicon-internal
          path: desktop/target/release/bundle/macos/*.tar.gz
          retention-days: 3

  scanner-feasibility:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: brew install gnupg
      - run: node scripts/scanner/probe-macos.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-scanner-feasibility
          path: desktop/target/macos-probe/scanner-inventory.json
          retention-days: 3
