name: Check ClamAV upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: '31 7 * * 1'

permissions:
  contents: read

jobs:
  upstream:
    if: github.repository_id == '1421171092'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report newer official engine versions without installing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/scanner/check-upstream.py
