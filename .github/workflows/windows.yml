name: Alpha Windows validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      offline:
        description: Also build the larger offline WebView2 installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Resolve locked frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build and test both SDK adapters and the host
        working-directory: engine
        run: .\mvnw.cmd --batch-mode verify
      - name: Test frontend contracts
        run: npm test
      - name: Stage Java runtime and packaged adapters
        run: npm run stage:engine
      - name: Exercise the actual packaged Java engine
        run: npm run test:engine
      - name: Build frontend
        run: npm run build:frontend
      - name: Test native protocol contracts
        working-directory: desktop
        run: cargo test --locked
      - name: Build unsigned Windows setup
        run: npm run desktop:build -- -- --locked
      - name: Retain unsigned alpha installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-alpha-unsigned-setup
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Build offline installer
        if: github.event_name == 'workflow_dispatch' && inputs.offline
        run: npm run desktop:build:offline -- -- --locked
      - name: Retain unsigned offline installer
        if: github.event_name == 'workflow_dispatch' && inputs.offline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-alpha-unsigned-offline-setup
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
