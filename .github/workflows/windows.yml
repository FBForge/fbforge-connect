name: Windows release validation

on:
  push:
    branches: ['release/0.2.0']
    paths:
      - .github/workflows/windows.yml
      - scripts/windows-install-smoke.ps1
      - scripts/windows-accessibility-smoke.ps1
      - scripts/ci/prepare-nvda.ps1
      - scripts/ci/nvda-capture.py
  workflow_dispatch:
    inputs:
      upgrade_run:
        description: Optional successful signed run to test upgrading from an earlier version
        required: false
        type: string
      offline:
        description: Also build the larger offline WebView2 installer
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signing-contracts:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Windows signing checks without a signing certificate
        shell: powershell
        run: ./scripts/ci/test-windows-signing.ps1

  test-readonly:
    if: github.repository_id == '1421171092' && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release/0.2.0')) || (github.event_name == 'push' && github.ref == 'refs/heads/release/0.2.0'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: engine/**/pom.xml
      - name: Build the actual SDK adapters and host for read-only TEST checks
        working-directory: engine
        run: ./mvnw --batch-mode -DskipTests package
      - name: Stage the actual Java runtime and adapters
        run: node scripts/stage-engine.mjs
      - name: Check real TEST authentication, process discovery and read operations
        env:
          SENDERID: ${{ secrets.SENDERID }}
          SENDERSECRET: ${{ secrets.SENDERSECRET }}
          SENDERDEST: ${{ secrets.SENDERDEST }}
          SUBSCRIBERID: ${{ secrets.SUBSCRIBERID }}
          SUBSCRIBERSECRET: ${{ secrets.SUBSCRIBERSECRET }}
        run: node scripts/live-readonly.mjs

  windows:
    if: github.repository_id == '1421171092' && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release/0.2.0')) || (github.event_name == 'push' && github.ref == 'refs/heads/release/0.2.0'))
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: engine/**/pom.xml
      - name: Restore Rust dependencies and build outputs
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
            desktop/native-contracts/target
          key: ${{ runner.os }}-rust-1.99.0-${{ hashFiles('desktop/Cargo.lock', 'desktop/native-contracts/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rust-1.99.0-${{ hashFiles('desktop/Cargo.lock', 'desktop/native-contracts/Cargo.lock') }}-
      - name: Install pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Resolve locked frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check frontend style and lint
        run: |
          npm run licenses:check
          npm run lint
          npm run format:check
      - name: Check Rust formatting
        run: |
          cargo +1.99.0 fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo +1.99.0 fmt --manifest-path desktop/native-contracts/Cargo.toml --all -- --check
      - name: Build and test both SDK adapters and the host
        working-directory: engine
        run: .\mvnw.cmd --batch-mode verify
      - name: Test frontend contracts
        run: npm test
      - name: Stage Java runtime and packaged adapters
        run: npm run stage:engine
      - name: Exercise the actual packaged Java engine
        run: npm run test:engine
      - name: Build frontend
        run: npm run build:frontend
      - name: Install browser for synthetic UI regression tests
        run: npx playwright install chromium
      - name: Fetch immutable public FIM schema fixtures with integrity checks
        run: node scripts/fetch-public-schemas.mjs
      - name: Test application workflows in browser
        run: npm run test:ui
      - name: Test isolated native protocol and protected profile storage
        run: |
          cargo +1.99.0 test --manifest-path desktop/native-contracts/Cargo.toml --locked
          cargo +1.99.0 test --manifest-path desktop/native-contracts/Cargo.toml --locked --example profile-checkpoint
      - name: Test native protocol contracts
        working-directory: desktop
        run: cargo +1.99.0 test --locked
      - name: Build unsigned Windows setup
        run: |
          # Cached build outputs may contain installers from an older product/version.
          $bundles = 'desktop/target/release/bundle/nsis'
          if (Test-Path -LiteralPath $bundles) { Remove-Item -LiteralPath $bundles -Recurse -Force }
          npm run desktop:build -- -- --locked
      - name: Build CI-only protected profile fixture bridge
        run: cargo +1.99.0 build --manifest-path desktop/native-contracts/Cargo.toml --locked --target-dir desktop/native-contracts/target --example profile-checkpoint
      - name: Save Rust build outputs before installation validation
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
            desktop/native-contracts/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Load a verified signed upgrade baseline
        if: github.event_name == 'push' || inputs.upgrade_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_RUN: ${{ inputs.upgrade_run }}
          UPGRADE_LATEST: ${{ github.event_name == 'push' }}
        run: python scripts/load-upgrade-baseline.py
      - name: Verify baseline signature and timestamp
        if: github.event_name == 'push' || inputs.upgrade_run != ''
        run: |
          Import-Module './scripts/windows-signing.psm1' -Force
          $tool = Get-WindowsSignTool
          $null = Assert-WindowsSignature -Path $env:FITCONNECT_PREVIOUS_INSTALLER -Thumbprint $env:FITCONNECT_PREVIOUS_SIGNER -SignTool $tool
      - name: Install the real desktop application and verify bundled runtime and profile preservation
        run: |
          $setup = @(Get-ChildItem 'desktop/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'installer_missing' }
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', './scripts/windows-install-smoke.ps1', '-InstallerPath', $setup[0].FullName, '-CheckpointBridge', 'desktop/native-contracts/target/debug/examples/profile-checkpoint.exe', '-ExpectedBinaryPath', 'desktop/target/release/fit-connect-integration-client.exe')
          if ($env:FITCONNECT_PREVIOUS_INSTALLER) { $arguments += @('-PreviousInstallerPath', $env:FITCONNECT_PREVIOUS_INSTALLER) }
          & powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw 'installed_desktop_validation_failed' }
      - name: Prepare pinned official NVDA for desktop accessibility checks
        run: ./scripts/ci/prepare-nvda.ps1
      - name: Observe actual NVDA speech and native keyboard navigation in installed desktop app
        run: |
          $setup = @(Get-ChildItem 'desktop/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'installer_missing' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/windows-accessibility-smoke.ps1 -InstallerPath $setup[0].FullName -ExpectedBinaryPath 'desktop/target/release/fit-connect-integration-client.exe' -NvdaPath $env:FBFC_NVDA_PATH
          if ($LASTEXITCODE -ne 0) { throw 'installed_accessibility_validation_failed' }
      - name: Retain bounded credential-free accessibility result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nvda-accessibility-result
          path: ${{ runner.temp }}/fbforge-accessibility-result.json
          if-no-files-found: error
      - name: Record installer checksum and build provenance
        run: |
          $setup = @(Get-ChildItem 'desktop/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'installer_missing' }
          $hash = (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('Installer SHA256: ' + $hash)
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $setup[0].DirectoryName 'SHA256SUMS.txt'), ($hash + '  ' + $setup[0].Name + "`n"), $utf8)
          $build = [ordered]@{ application = 'FBForge Connect'; version = (Get-Content 'desktop/tauri.conf.json' -Raw | ConvertFrom-Json).version; repository = $env:GITHUB_REPOSITORY; commit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; platform = 'windows-x64'; signing = 'unsigned'; installer = $setup[0].Name; bytes = $setup[0].Length; sha256 = $hash }
          [IO.File]::WriteAllText((Join-Path $setup[0].DirectoryName 'build-info.json'), (($build | ConvertTo-Json) + "`n"), $utf8)
      - name: Retain unsigned alpha installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-alpha-unsigned-setup
          path: |
            desktop/target/release/bundle/nsis/*-setup.exe
            desktop/target/release/bundle/nsis/SHA256SUMS.txt
            desktop/target/release/bundle/nsis/build-info.json
          if-no-files-found: error
      - name: Build offline installer
        if: github.event_name == 'workflow_dispatch' && inputs.offline
        run: npm run desktop:build:offline -- -- --locked
      - name: Retain unsigned offline installer
        if: github.event_name == 'workflow_dispatch' && inputs.offline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-alpha-unsigned-offline-setup
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
