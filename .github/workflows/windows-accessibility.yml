name: Focused Windows accessibility validation

on:
  push:
    branches: [alpha1-accessibility-tests]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    if: github.repository_id == '1421171092' && github.ref == 'refs/heads/alpha1-accessibility-tests'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the previously verified immutable UI candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $revision = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39038478823" --jq '.head_sha'
          if ($LASTEXITCODE -ne 0 -or $revision -ne 'f0e7edc9f6d231f35c27da659969ccb4dcb010eb') { throw 'accessibility_fixture_provenance_failed' }
          $directory = Join-Path $env:RUNNER_TEMP ('fbforge-accessibility-fixture-' + [Guid]::NewGuid().ToString('N'))
          gh run download 39038478823 --repo "$env:GITHUB_REPOSITORY" --name windows-alpha-unsigned-setup --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'accessibility_fixture_download_failed' }
          $setup = @(Get-ChildItem -LiteralPath $directory -Filter '*-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'accessibility_fixture_ambiguous' }
          if ((Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8b1fbf43b9d617252bcee9c6baeb8eb579b7d4cf81cd1f1f2dd3fe819347cfc8') { throw 'accessibility_fixture_integrity_failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "FBFC_ACCESSIBILITY_INSTALLER=$($setup[0].FullName)"
      - name: Prepare pinned official NVDA
        run: ./scripts/ci/prepare-nvda.ps1
      - name: Exercise actual NVDA speech and native keyboard navigation
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/windows-accessibility-smoke.ps1 -InstallerPath $env:FBFC_ACCESSIBILITY_INSTALLER -ExpectedInstallerSha256 '8b1fbf43b9d617252bcee9c6baeb8eb579b7d4cf81cd1f1f2dd3fe819347cfc8' -NvdaPath $env:FBFC_NVDA_PATH
          if ($LASTEXITCODE -ne 0) { throw 'focused_accessibility_validation_failed' }
      - name: Retain bounded credential-free result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nvda-accessibility-result
          path: ${{ runner.temp }}/fbforge-accessibility-result.json
          if-no-files-found: error
