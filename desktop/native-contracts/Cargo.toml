[package]
name = "fbforge-connect-native-contracts"
version = "0.3.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
sha2 = "=0.10.9"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
semver = "=1.0.28"
base64 = "=0.22.1"
minisign-verify = "=0.3.0"

tokio = { version = "=1.53.3", features = ["rt", "time", "macros", "process", "net", "io-util"] }

reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy", "stream"] }

rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
