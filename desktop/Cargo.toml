[package]
name = "fit-connect-integration-client"
version = "0.1.0-dev.5"
edition = "2021"
rust-version = "1.90"
license = "EUPL-1.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["process", "io-util", "sync", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

