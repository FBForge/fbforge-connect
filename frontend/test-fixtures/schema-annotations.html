<!doctype html><meta charset="utf-8"><title>Schema-Zuordnung · synthetische Tests</title><pre id="result">Prüfung läuft …</pre><script type="module">
import { parseStructuredData } from '../src/structured-data.js';
import { annotateSchema } from '../src/schema-annotations.js';
const failures=[],checks=[];
function equal(actual,expected,message){if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push({message,actual,expected});else checks.push(message);}
const ns='http://www.w3.org/2001/XMLSchema', uri='https://example.test/root.xsd';
const doc=(body,extra='')=>`<xs:schema xmlns:xs="${ns}" xmlns:t="urn:test" targetNamespace="urn:test" elementFormDefault="qualified" ${extra}>${body}</xs:schema>`;
const annotation=text=>`<xs:annotation><xs:documentation xml:lang="de">${text}</xs:documentation></xs:annotation>`;
const run=(xml,root,other=[])=>{const model=parseStructuredData(xml,'xml');const before=JSON.stringify(model);const result=annotateSchema(model,JSON.stringify({schemaPackage:1,schemaUri:uri,schemas:[{name:uri,text:root,primary:true},...other]}),uri);equal(JSON.stringify(model),before,'Originalmodell unverändert');return result;};
const nodes=node=>[node,...node.children.flatMap(nodes)];const field=(result,key)=>nodes(result.root).find(n=>n.key===key);
try {
 const plain=run('<antrag><F123>Erika</F123></antrag>',`<xs:schema xmlns:xs="${ns}"><xs:element name="antrag"><xs:complexType><xs:sequence><xs:element name="F123" type="xs:string">${annotation('Vorname ohne Namensraum')}</xs:element></xs:sequence></xs:complexType></xs:element></xs:schema>`);
 equal(field(plain,'F123').label,'Vorname ohne Namensraum','XSD ohne targetNamespace');
 const root=doc(`<xs:include schemaLocation="types.xsd"/><xs:import namespace="urn:other" schemaLocation="other.xsd"/><xs:element name="antrag">${annotation('Testantrag')}<xs:complexType><xs:sequence><xs:element name="F123" type="t:PersonName">${annotation('Vorname\nRufname der antragstellenden Person.')}</xs:element><xs:element name="code" type="t:Status"/><xs:element ref="o:F123" xmlns:o="urn:other"/><xs:choice><xs:element name="a" type="xs:string"/><xs:element name="b" type="xs:string"/></xs:choice></xs:sequence><xs:attribute name="id" type="xs:integer" use="required">${annotation('Antragskennung')}</xs:attribute></xs:complexType></xs:element>`);
 const types=doc(`<xs:simpleType name="PersonName"><xs:restriction base="xs:string"/></xs:simpleType><xs:simpleType name="Status"><xs:restriction base="xs:string"><xs:enumeration value="N">${annotation('Neu eingegangen')}</xs:enumeration></xs:restriction></xs:simpleType>`);
 const other=`<xs:schema xmlns:xs="${ns}" targetNamespace="urn:other"><xs:element name="F123" type="xs:string">${annotation('Anderer Namensraum')}</xs:element></xs:schema>`;
 const result=run('<t:antrag xmlns:t="urn:test" xmlns:o="urn:other" id="9007199254740993"><t:F123>Erika</t:F123><t:code>N</t:code><o:F123>Fremd</o:F123><t:a>Wahl</t:a></t:antrag>',root,[{name:'types.xsd',text:types,primary:false},{name:'other.xsd',text:other,primary:false}]);
 equal(result.root.label,'Testantrag','Wurzel aus Dokumentation');equal(field(result,'t:F123').label,'Vorname','FIM-artige Feldkennung aus XSD');equal(field(result,'t:F123').value,'Erika','Wert bleibt Fachdatenwert');equal(field(result,'t:F123').schema.required,true,'Pflichtfeld aus Sequenz');equal(field(result,'@id').label,'Antragskennung','Attributbeschreibung');equal(field(result,'@id').value,'9007199254740993','XML-Präzision bleibt erhalten');equal(field(result,'t:code').schema.valueLabel,'Neu eingegangen','Codebezeichnung aus Enumeration');equal(field(result,'o:F123').label,'Anderer Namensraum','Import nach Namensraum');equal(field(result,'t:a').schema.required,null,'Choice kein falsches Pflichtfeld');
 const optional=run('<t:antrag xmlns:t="urn:test"><t:x>Wert</t:x></t:antrag>',doc('<xs:element name="antrag"><xs:complexType><xs:sequence minOccurs="0"><xs:element name="x" type="xs:string"/></xs:sequence></xs:complexType></xs:element>'));
 equal(field(optional,'t:x').schema.required,false,'Optionale Gruppe vererbt Optionalität');
 const chameleon=run('<t:antrag xmlns:t="urn:test"><t:F123>Erika</t:F123></t:antrag>',doc('<xs:include schemaLocation="shared.xsd"/><xs:element name="antrag" type="t:Shared"/>'),[{name:'shared.xsd',text:`<xs:schema xmlns:xs="${ns}" elementFormDefault="qualified"><xs:complexType name="Shared"><xs:sequence><xs:element name="F123" type="xs:string">${annotation('Vorname')}</xs:element></xs:sequence></xs:complexType></xs:schema>`}]);
 equal(field(chameleon,'t:F123').label,'Vorname','Chameleon-Include übernimmt Namensraum');
 for(const broken of ['<xs:schema','<!DOCTYPE schema SYSTEM "https://example.invalid/secret"><xs:schema/>']){const fallback=run('<t:antrag xmlns:t="urn:test"/>',broken);equal(fallback.labelCount,0,'Fehlerhafte und DTD-Schemata ohne Beschriftung');}
 const conflict=run('<t:antrag xmlns:t="urn:test"><t:x>Wert</t:x></t:antrag>',doc('<xs:include schemaLocation="duplicate.xsd"/><xs:element name="antrag" type="t:Conflict"/><xs:complexType name="Conflict"><xs:sequence><xs:element name="x">'+annotation('A')+'</xs:element></xs:sequence></xs:complexType>'),[{name:'duplicate.xsd',text:doc('<xs:complexType name="Conflict"><xs:sequence><xs:element name="x">'+annotation('B')+'</xs:element></xs:sequence></xs:complexType>')}]);
 equal(field(conflict,'t:x').schema,null,'Doppelte Typdefinition wird nicht willkürlich gewählt');
} catch(error){failures.push({error:String(error),stack:error.stack});}
window.__schemaTestResult={checks,failures};document.querySelector('#result').textContent=JSON.stringify(window.__schemaTestResult,null,2);
</script>
