<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zustellpunktanlage · synthetische Testdaten</title></head><body><div id="app"></div><script type="module">
import { createApp, ref, h } from 'vue'; import DestinationSetup from '../src/DestinationSetup.vue';
import '../src/site.css';import '../src/layout.css';import '../src/desktop.css';
const id=n=>`11111111-1111-4111-8111-${String(n).padStart(12,'0')}`;
const session={apiVersion:'v3',sessionId:id(1),environment:'TEST',connected:true,role:'online-service'};
const key=(purpose,n)=>({kid:id(n),purpose,fingerprint:'a'.repeat(64),expiresAt:'2027-10-16T00:00:00Z'});
const publicKey=(purpose,n)=>({kty:'RSA',key_ops:[purpose==='decrypt'?'wrapKey':'verify'],alg:purpose==='decrypt'?'RSA-OAEP-256':'PS512',kid:id(n),n:'A'.repeat(683),e:'AQAB',x5c:['AQID']});
const fixture=window.__creationFixture={writes:0,generated:0,reconciles:0,calls:[],bundles:[],uncertain:false,profileMissing:false,created:null,receive:null,state:{attemptId:null,status:'idle',bundleId:null,configurationJson:null,destinationId:null,error:null,httpStatus:null}};
const envelope=data=>({apiVersion:session.apiVersion,sessionId:session.sessionId,environment:'TEST',data});
window.__TAURI_INTERNALS__={async invoke(command,args){fixture.calls.push(command);
 if(command==='destination_creation_state')return envelope(fixture.state);
 if(command==='list_generated_keys')return envelope({bundles:fixture.bundles});
 if(command==='generate_test_keys'){
  if(fixture.profileMissing)throw 'vault_profile_required';fixture.generated++;
  const bundle={bundleId:id(2),destinationId:null,status:'ready',encryption:key('decrypt',3),signing:key('sign',4)};fixture.bundles=[bundle];return envelope(bundle);
 }
 if(command==='prepare_destination_creation'){
  const draft=JSON.parse(args.destinationDocument);fixture.lastDraft=draft;
  const configuration={...draft.configuration,status:'created',encryptionKid:id(3),encryptionPublicKey:publicKey('decrypt',3),signingPublicKey:publicKey('sign',4),publicForRouting:false};
  fixture.state={attemptId:id(5),status:'prepared',bundleId:id(2),configurationJson:JSON.stringify(configuration),destinationId:null,error:null,httpStatus:null};fixture.bundles[0].status='reserved';return envelope(fixture.state);
 }
 if(command==='cancel_destination_creation'){fixture.state={...fixture.state,status:'cancelled'};fixture.bundles[0].status='ready';return envelope(fixture.state);}
 if(command==='execute_destination_creation'){
  fixture.writes++;fixture.state={...fixture.state,status:fixture.uncertain?'uncertain':'confirmed',destinationId:id(6),error:fixture.uncertain?'resource_unavailable':null};fixture.bundles[0].status=fixture.uncertain?'unresolved':'bound';fixture.bundles[0].destinationId=id(6);return envelope(fixture.state);
 }
 if(command==='reconcile_destination_creation'){fixture.reconciles++;fixture.bundles[0].status='bound';fixture.state={attemptId:null,status:'confirmed',bundleId:args.bundleId,configurationJson:null,destinationId:args.destinationId,error:null,httpStatus:null};return envelope(fixture.state);}
 if(command==='use_generated_keys')return envelope({keys:[{destinationId:id(6),kid:id(3),purpose:'decrypt'},{destinationId:id(6),kid:id(4),purpose:'sign'}]});
 throw 'resource_denied';
}};
createApp({setup(){const busy=ref(false);return()=>h('main',{class:'workspace-content'},[h('p','SYNTHETISCHE TESTDATEN · keine FIT-Connect-Verbindung'),h(DestinationSetup,{session,busy:busy.value,onBusy:value=>busy.value=value,onCreated:id=>fixture.created=id,onReceive:id=>fixture.receive=id})]);}}).mount('#app');
</script></body></html>
