<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schlüsselwechsel · synthetische Testdaten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref, h } from 'vue';
      import DestinationKeyRotation from '../src/DestinationKeyRotation.vue';
      import '../src/site.css';
      import '../src/layout.css';
      import '../src/desktop.css';
      const id = (n) => `11111111-1111-4111-8111-${String(n).padStart(12, '0')}`;
      const session = { apiVersion: 'v3', sessionId: id(1), environment: 'TEST', connected: true };
      const fixture = (window.__rotationFixture = {
        generated: 0,
        writes: 0,
        cancelled: 0,
        receive: null,
        uncertain: false,
        bundles: [],
        state: { attemptId: null, status: 'idle', changes: [] },
      });
      const envelope = (data) => ({ apiVersion: 'v3', sessionId: id(1), environment: 'TEST', data });
      const key = (purpose, n) => ({
        kid: id(n),
        purpose,
        fingerprint: 'a'.repeat(64),
        expiresAt: '2027-10-16T00:00:00Z',
      });
      window.__TAURI_INTERNALS__ = {
        async invoke(command, args) {
          if (command === 'list_generated_keys') return envelope({ bundles: fixture.bundles });
          if (command === 'generate_test_keys') {
            const n = 10 + fixture.generated++ * 3,
              bundle = {
                bundleId: id(n),
                status: 'ready',
                destinationId: null,
                encryption: key('decrypt', n + 1),
                signing: key('sign', n + 2),
              };
            fixture.bundles.push(bundle);
            return envelope(bundle);
          }
          if (command === 'prepare_destination_rotation') {
            const { destinations } = JSON.parse(args.destinationDocument);
            fixture.state = {
              attemptId: id(7),
              status: 'prepared',
              changes: destinations.map((row, index) => {
                const bundle = fixture.bundles.find((item) => item.bundleId === row.bundleId);
                bundle.status = 'reserved';
                return {
                  ...row,
                  name: `TEST ${index + 1}`,
                  beforeEncryptionKid: 'old-key',
                  encryptionKid: bundle.encryption.kid,
                  signingKid: bundle.signing.kid,
                  status: 'prepared',
                  stage: 'not_started',
                  error: null,
                  httpStatus: null,
                };
              }),
            };
            return envelope(fixture.state);
          }
          if (command === 'cancel_destination_rotation') {
            fixture.cancelled++;
            fixture.bundles.forEach((item) => (item.status = 'ready'));
            fixture.state = { ...fixture.state, status: 'cancelled', changes: [] };
            return envelope(fixture.state);
          }
          if (command === 'execute_destination_rotation') {
            fixture.writes++;
            fixture.state = {
              ...fixture.state,
              status: fixture.uncertain ? 'uncertain' : 'completed',
              changes: fixture.state.changes.map((row, index) => {
                const bundle = fixture.bundles.find((item) => item.bundleId === row.bundleId);
                bundle.status = fixture.uncertain ? 'unresolved' : 'bound';
                bundle.destinationId = row.destinationId;
                return {
                  ...row,
                  status: fixture.uncertain ? (index === 0 ? 'uncertain' : 'skipped') : 'updated',
                  stage: fixture.uncertain ? 'partially_registered' : 'verified',
                  error: fixture.uncertain ? 'resource_unavailable' : null,
                };
              }),
            };
            return envelope(fixture.state);
          }
          if (command === 'destination_rotation_state') return envelope(fixture.state);
          if (command === 'use_generated_keys') {
            const bundle = fixture.bundles.find((item) => item.bundleId === args.bundleId);
            return envelope({
              keys: [
                { destinationId: args.destinationId, kid: bundle.encryption.kid, purpose: 'decrypt' },
                { destinationId: args.destinationId, kid: bundle.signing.kid, purpose: 'sign' },
              ],
            });
          }
          throw 'resource_denied';
        },
      };
      createApp({
        setup() {
          const busy = ref(false);
          return () =>
            h('main', { class: 'workspace-content' }, [
              h('p', 'SYNTHETISCHE TESTDATEN · keine FIT-Connect-Verbindung'),
              h(DestinationKeyRotation, {
                session,
                selected: [
                  { destinationId: id(2), name: 'TEST 1' },
                  { destinationId: id(3), name: 'TEST 2' },
                ],
                busy: busy.value,
                onBusy: (value) => (busy.value = value),
                onReceive: (id) => (fixture.receive = id),
              }),
            ]);
        },
      }).mount('#app');
    </script>
  </body>
</html>
