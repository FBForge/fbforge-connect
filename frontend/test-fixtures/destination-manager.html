<!doctype html><html lang="de"><head><meta charset="UTF-8"><title>Zustellpunktverwaltung – synthetische Testdaten</title></head><body><div id="app"></div><script type="module">
import { createApp, ref, h } from 'vue';
import DestinationManager from '../src/DestinationManager.vue';
import '../src/site.css'; import '../src/layout.css';
const A='11111111-1111-4111-8111-111111111111', B='22222222-2222-4222-8222-222222222222';
const session={apiVersion:'v3',sessionId:'44444444-4444-4444-8444-444444444444',environment:'TEST',connected:true};
const records = new Map([A,B].map((id,i)=>[id,{destinationId:id,name:i?'Fachverfahren Süd':'Onlinedienst Nord',status:'active',type:'A',contactInformation:{legalName:'Testorganisation',address:'Teststraße 1\n12345 Teststadt',phone:'123',email:'test@example.invalid',unit:null,cc:[]},publicServices:[],processMessages:[],metadataVersions:['2.0.0'],possibleNextStatus:['inactive']} ]));
const fixture = window.__destinationFixture={ records,writes:0,loseResponse:false,calls:[],state:{attemptId:null,status:'idle',changes:[]} };
const envelope=data=>({apiVersion:session.apiVersion,sessionId:session.sessionId,environment:'TEST',data});
window.__TAURI_INTERNALS__={ async invoke(command,args){
 fixture.calls.push(command);
 if(args.apiVersion!==session.apiVersion||args.sessionId!==session.sessionId)throw 'session_missing';
 if(command==='list_destinations')return envelope({offset:0,totalCount:2,destinations:[...records.values()].map(({destinationId,name,status,type})=>({destinationId,name,status,type}))});
 if(command==='load_managed_destination'){const r=records.get(args.destinationId); return envelope({destinationId:r.destinationId,name:r.name,status:r.status,type:'A',offersJson:'{"publicServices":[],"processMessages":[]}',contactJson:JSON.stringify(r.contactInformation),metadataVersions:r.metadataVersions,possibleNextStatus:r.possibleNextStatus});}
 if(command==='prepare_destination_cleanup'){const row=records.get(args.destinationId);fixture.cleanup={attemptId:'55555555-5555-4555-8555-555555555555',destinationId:row.destinationId,name:row.name,status:'prepared',error:null};return envelope(fixture.cleanup);}
 if(command==='cancel_destination_cleanup'){fixture.cleanup.status='cancelled';return envelope(fixture.cleanup);}
 if(command==='execute_destination_cleanup'){fixture.writes++;records.delete(fixture.cleanup.destinationId);fixture.cleanup.status='removed';return envelope(fixture.cleanup);}
 if(command==='prepare_destination_update'){
   const request=JSON.parse(args.destinationDocument);
   fixture.state={attemptId:crypto.randomUUID(),status:'prepared',changes:request.destinationIds.map(id=>{
     const current=records.get(id), before={}, after={};
     for(const [key,value] of Object.entries(request.changes)){
       before[key]=current[key]; after[key]=key==='name'?value.replaceAll('{name}',current.name):key==='contactInformation'?{...current[key],...value}:value;
     }
     return {destinationId:id,name:current.name,beforeJson:JSON.stringify(before),afterJson:JSON.stringify(after),status:'prepared',error:null};
   })}; return envelope(fixture.state);
 }
 if(command==='cancel_destination_update'){fixture.state={attemptId:args.attemptId,status:'cancelled',changes:[]};return envelope(fixture.state);}
 if(command==='execute_destination_update'){
   if(args.attemptId!==fixture.state.attemptId||fixture.state.status!=='prepared')throw 'destination_update_locked';
   fixture.writes++; fixture.state={...fixture.state,status:'completed',changes:fixture.state.changes.map(row=>{
     Object.assign(records.get(row.destinationId),JSON.parse(row.afterJson));return {...row,status:'updated'};
   })}; if(fixture.loseResponse)throw 'resource_unavailable'; return envelope(fixture.state);
 }
 if(command==='destination_update_state')return envelope(fixture.state);
 throw 'invalid_input';
}};
createApp({setup(){const busy=ref(false);return()=>h('main',{class:'client-shell'},[h(DestinationManager,{session,busy:busy.value,onBusy:value=>{busy.value=value;}})]);}}).mount('#app');
</script></body></html>
