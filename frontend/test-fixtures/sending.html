<!doctype html>
<!-- Development-only synthetic UI fixture. No native engine or FIT-Connect network access. -->
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Sender · UI-Testdaten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { testLibraryFixture } from './test-library-fixture.js';
      import { createApp, h, ref, provide } from 'vue';
      import { processWorkspaceKey, createProcessWorkspace } from '../src/process-context.js';
      import SubmissionSender from '../src/SubmissionSender.vue';
      import '../src/styles/index.css';
      import '../src/styles/index.css';
      const api = ref('v3'),
        busy = ref(false),
        uncertain = ref(false),
        activity = ref('Noch keine Aktion');
      const eventTarget = ref(null);
      const id = '11111111-1111-4111-8111-111111111111';
      const files = new Map();
      window.__sendFixture = { validationError: null, validations: 0 };
      let current = { attemptId: null, status: 'idle', submissionId: null, caseId: null, error: null };
      const envelope = (data) => ({ apiVersion: api.value, sessionId: id, environment: 'TEST', data });
      window.__TAURI_INTERNALS__ = {
        async invoke(command, args) {
          if (command === 'test_library') return testLibraryFixture(args.request);
          if (args.apiVersion !== api.value || args.sessionId !== id) throw 'session_missing';
          if (command === 'load_send_destination')
            return envelope({
              destinationId: args.destinationId,
              detailsJson: JSON.stringify({
                destinationId: args.destinationId,
                publicServices: [
                  {
                    identifier: 'urn:test:service',
                    name: 'Fiktive Testleistung',
                    submissionSchemas: [{ schemaUri: 'urn:test:antrag', mimeType: 'application/json' }],
                    replyChannels: {
                      fitConnect: { processStandards: ['urn:fbforge:connect:reply:status:1'] },
                    },
                  },
                ],
              }),
            });
          if (command === 'load_send_schema') {
            const packet = JSON.stringify({
              schemaPackage: 1,
              schemaUri: 'urn:test:antrag',
              documents: {
                'urn:test:antrag': {
                  $id: 'urn:test:antrag',
                  type: 'object',
                  required: ['vorname', 'nachname'],
                  properties: {
                    vorname: { title: 'Vorname', type: 'string' },
                    nachname: { title: 'Nachname', type: 'string' },
                    anliegen: { title: 'Anliegen', type: 'string' },
                  },
                },
              },
            });
            const bytes = new TextEncoder().encode(packet);
            return envelope({
              schemaId: '55555555-5555-4555-8555-555555555555',
              schemaUri: 'urn:test:antrag',
              byteOffset: 0,
              totalBytes: bytes.length,
              chunk: btoa(String.fromCharCode(...bytes)),
            });
          }
          if (command === 'case_workspace' && args.operation === 'status')
            return envelope({ persistent: false, storageError: null });
          if (command === 'begin_content') {
            const contentId = crypto.randomUUID();
            files.set(contentId, { total: args.totalBytes, received: 0 });
            return envelope({
              contentId,
              totalBytes: args.totalBytes,
              receivedBytes: 0,
              complete: args.totalBytes === 0,
            });
          }
          if (command === 'append_content') {
            const file = files.get(args.contentId);
            file.received += atob(args.chunk).length;
            return envelope({
              contentId: args.contentId,
              totalBytes: file.total,
              receivedBytes: file.received,
              complete: file.total === file.received,
            });
          }
          if (command === 'discard_content') {
            files.delete(args.contentId);
            return envelope({ contentId: args.contentId });
          }
          if (command === 'validate_send_data') {
            window.__sendFixture.validations++;
            if (window.__sendFixture.validationError) throw window.__sendFixture.validationError;
            const request = JSON.parse(args.schemaDocument);
            return envelope({
              schemaUri: request.schemaUri,
              mimeType: request.mimeType,
              dataBytes: files.get(request.contentId).total,
              valid: true,
            });
          }
          if (command === 'prepare_send') {
            window.__sendFixture.preparedDocument = JSON.parse(args.sendDocument);
            const { contentId, attachments, ...draft } = JSON.parse(args.sendDocument);
            current = {
              attemptId: crypto.randomUUID(),
              status: 'prepared',
              submissionId: null,
              caseId: null,
              error: null,
            };
            return envelope({
              attempt: current,
              summary: {
                ...draft,
                dataBytes: files.get(contentId).total,
                attachments: attachments.map(({ contentId, ...item }) => ({
                  ...item,
                  bytes: files.get(contentId).total,
                })),
              },
            });
          }
          if (command === 'execute_send') {
            if (args.attemptId !== current.attemptId || current.status !== 'prepared') throw 'send_locked';
            current = {
              ...current,
              status: uncertain.value ? 'uncertain' : 'sent',
              submissionId: '22222222-2222-4222-8222-222222222222',
              caseId: '33333333-3333-4333-8333-333333333333',
              error: uncertain.value ? 'resource_unavailable' : null,
            };
            return envelope(current);
          }
          if (command === 'cancel_send') {
            current = { ...current, status: 'cancelled' };
            return envelope(current);
          }
          if (command === 'send_state') return envelope(current);
          if (command === 'acknowledge_send_uncertainty') return envelope(current);
          throw 'engine_protocol_error';
        },
      };
      createApp({
        setup() {
          const workspace = createProcessWorkspace();
          workspace.messages.value = [
            {
              processModelId: 'urn:test:process:1',
              messageId: 'request-more',
              label: 'Nachforderung',
              schemaUri: 'urn:fbforge:connect:reply:status:1',
              mimeType: 'application/json',
            },
            {
              processModelId: 'urn:test:process:1',
              messageId: 'wrong-schema',
              label: 'Abweichendes Schema',
              schemaUri: 'urn:test:other',
              mimeType: 'application/json',
            },
          ];
          provide(processWorkspaceKey, workspace);
          return () =>
            h('main', { class: 'page client-page' }, [
              h('section', { class: 'tool-section' }, [
                h('h1', 'Sender · ausschließlich synthetische UI-Testdaten'),
                h('p', 'Keine FIT-Connect-Verbindung. Keine echten Inhalte auswählen.'),
                h('div', { class: 'client-actions' }, [
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      onClick: () =>
                        (document.documentElement.dataset.theme =
                          document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'),
                    },
                    'Theme wechseln',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (api.value = api.value === 'v3' ? 'v2' : 'v3'),
                    },
                    'API wechseln',
                  ),
                  h('label', [
                    h('input', {
                      type: 'checkbox',
                      checked: uncertain.value,
                      onChange: (event) => (uncertain.value = event.target.checked),
                    }),
                    'Ungewissen Ausgang simulieren',
                  ]),
                ]),
                h('p', { role: 'status' }, activity.value),
              ]),
              h(SubmissionSender, {
                session: {
                  apiVersion: api.value,
                  sessionId: id,
                  environment: 'TEST',
                  connected: true,
                  role: 'online-service',
                },
                busy: busy.value,
                onBusy: (value) => (busy.value = value),
                onActivity: (event) => (activity.value = `${event.action}: ${event.status}`),
                onEventLog: (value) => (eventTarget.value = value),
              }),
              eventTarget.value &&
                h('section', { class: 'tool-section', 'aria-label': 'Event-Log-Ziel' }, [
                  h('h2', 'Übernommene Event-Log-Kennungen'),
                  ...Object.entries(eventTarget.value).map(([key, value]) =>
                    h('p', [h('strong', key + ': '), h('code', value)]),
                  ),
                ]),
            ]);
        },
      }).mount('#app');
    </script>
  </body>
</html>
