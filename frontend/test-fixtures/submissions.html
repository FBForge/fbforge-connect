<!doctype html>
<!-- Development-only synthetic lookup fixture. No native backend or FIT-Connect traffic. -->
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Einreichungssuche · UI-Testdaten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref } from 'vue';
      import SubmissionBrowser from '../src/SubmissionBrowser.vue';
      import EventLogPanel from '../src/EventLogPanel.vue';
      import ReplyBrowser from '../src/ReplyBrowser.vue';
      import '../src/styles/index.css';
      import '../src/styles/index.css';
      const api = ref('v3'),
        busy = ref(false),
        activity = ref('Noch keine Aktion'),
        failVerification = ref(false),
        keyRevision = ref(0);
      const uuid = (index) => `44444444-4444-4444-8444-${String(index).padStart(12, '0')}`;
      const eventTarget = ref(null),
        eventVisible = ref(false),
        failEvents = ref(false),
        delayedEvents = ref(false);
      let eventSnapshot, finishEventRead, replyProof;
      const submissionRevision = ref(0),
        replyRevision = ref(0);
      const eventDocuments = Array.from({ length: 25 }, (_, index) => ({
        eventId: uuid(800 + index),
        eventType: `https://schema.fitko.de/fit-connect/events/${index === 0 ? 'submit' : index === 1 ? 'accept' : 'polling-notify'}-submission`,
        issuer:
          index === 2 ? '<img src=x onerror=alert(1)>' : 'https://test.fit-connect.fitko.dev/submission-api',
        issuedAt: `2026-10-16T08:${String(index).padStart(2, '0')}:00Z`,
        header: '{"alg":"PS512","kid":"synthetic-server","typ":"secevent+jwt"}',
        claims:
          '{\n"integer":9007199254740993,"nested":{"label":"Synthetischer Eintrag <em>bleibt Text</em>"}\n}',
      })).reverse();
      const destination = '11111111-1111-4111-8111-111111111111';
      const sessionId = () =>
        api.value === 'v3' ? '22222222-2222-4222-8222-222222222222' : '33333333-3333-4333-8333-333333333333';
      const rows = Array.from({ length: 21 }, (_, index) => ({
        destinationId: destination,
        submissionId: uuid(index + 1),
        caseId: uuid(100 + index),
      }));
      const envelope = (data) => ({
        apiVersion: api.value,
        sessionId: sessionId(),
        environment: 'TEST',
        data,
      });
      let proof = null,
        sequence = 600;
      const staged = new Map();
      const sentReceipts = ref(0),
        signedReceipts = ref(0),
        multipleKeys = ref(false),
        lostReceipt = ref(false);
      const idleReceipt = () => ({
        attemptId: null,
        status: 'idle',
        action: null,
        destinationId: null,
        submissionId: null,
        caseId: null,
        signingKid: null,
        error: null,
      });
      const receipts = new Map();
      const repliesSent = ref(0),
        lostReply = ref(false),
        replyAttempts = new Map();
      const idleReply = () => ({ attemptId: null, status: 'idle', replyId: null, caseId: null, error: null });

      const metadata =
        '{"$schema":"https://schema.fitko.de/fit-connect/metadata/2.0.0/metadata.schema.json","contentStructure":{"data":{"submissionSchema":{"schemaUri":"urn:test:fachdaten","mimeType":"application/json"}}},"nested":{"needle":"Erika"},"precise":9007199254740993,"duplicate":1,"duplicate":2}';
      const descriptions = [
        {
          kind: 'metadata',
          attachmentId: null,
          fileName: 'metadata.json',
          mimeType: 'application/json',
          description: null,
          source: metadata,
        },
        {
          kind: 'data',
          attachmentId: null,
          fileName: 'fachdaten.json',
          mimeType: 'application/json',
          description: null,
          source: '{"vorname":"Erika","nachname":"Mustermann","geburtsdatum":"1990-04-23"}',
        },
        {
          kind: 'attachment',
          attachmentId: uuid(400),
          fileName: 'Synthetischer_Antrag_mit_einem_langen_Dateinamen.pdf',
          mimeType: 'application/pdf',
          description: 'Antragsformular · <em>bleibt Text</em>',
          source: '%PDF-synthetic',
        },
        {
          kind: 'attachment',
          attachmentId: uuid(401),
          fileName: 'nachricht.xml',
          mimeType: 'application/xml',
          description: 'Synthetische Nachricht',
          source: '<nachricht><vorname>Erika</vorname></nachricht>',
        },
      ].map((item, index) => ({
        ...item,
        contentId: uuid(500 + index),
        bytes: new TextEncoder().encode(item.source),
      }));
      window.__TAURI_INTERNALS__ = {
        async invoke(command, args) {
          if (args.apiVersion !== api.value || args.sessionId !== sessionId()) throw 'session_missing';
          if (command === 'list_reply_channels')
            return envelope({
              channels: [
                {
                  attemptId: uuid(800),
                  destinationId: uuid(1),
                  fromDestinationId: api.value === 'v3' ? uuid(2) : null,
                  caseId: uuid(3),
                  submissionId: uuid(4),
                  keyId: `reply-key:${uuid(800)}`,
                  status: 'bound',
                },
                {
                  attemptId: uuid(801),
                  destinationId: uuid(1),
                  fromDestinationId: api.value === 'v3' ? uuid(2) : null,
                  caseId: null,
                  submissionId: null,
                  keyId: `reply-key:${uuid(801)}`,
                  status: 'unresolved',
                },
              ],
            });
          let receipt = receipts.get(args.apiVersion) || idleReceipt();
          if (command === 'reply_state')
            return envelope({ ...(replyAttempts.get(args.apiVersion) || idleReply()) });
          if (command === 'reply_target') {
            if (!proof || args.proofId !== proof.proofId) throw 'invalid_resource';
            const schemas = [
              { schemaUri: 'urn:test:antwort', mimeType: 'application/json' },
              { schemaUri: 'urn:test:antwort-xml', mimeType: 'application/xml' },
              { schemaUri: 'urn:test:freies-format', mimeType: null },
            ];
            return envelope({
              proofId: proof.proofId,
              destinationId: proof.destinationId,
              submissionId: proof.submissionId,
              caseId: proof.caseId,
              replyDestinationId: api.value === 'v3' ? uuid(300) : null,
              offset: args.offset,
              total: schemas.length,
              schemas: schemas.slice(args.offset, args.offset + 2),
            });
          }
          if (command === 'prepare_reply') {
            const draft = JSON.parse(args.replyDocument);
            if (!proof || draft.proofId !== proof.proofId) throw 'verification_failed';
            const value = {
              attemptId: uuid(sequence++),
              status: 'prepared',
              replyId: null,
              caseId: proof.caseId,
              error: null,
            };
            replyAttempts.set(args.apiVersion, value);
            return envelope({
              attempt: { ...value },
              summary: {
                proofId: proof.proofId,
                destinationId: proof.destinationId,
                submissionId: proof.submissionId,
                caseId: proof.caseId,
                schemaUri: draft.schemaUri,
                mimeType: draft.mimeType,
                processMessage: draft.processMessage,
                dataBytes: staged.get(draft.contentId).totalBytes,
                attachments: draft.attachments.map(({ contentId, ...item }) => ({
                  ...item,
                  bytes: staged.get(contentId).totalBytes,
                })),
              },
            });
          }
          if (command === 'execute_reply' || command === 'cancel_reply') {
            let value = replyAttempts.get(args.apiVersion);
            if (!value || value.status !== 'prepared' || value.attemptId !== args.attemptId)
              throw 'send_locked';
            if (command === 'cancel_reply') value = { ...value, status: 'cancelled' };
            else {
              repliesSent.value++;
              value = {
                ...value,
                status: lostReply.value ? 'uncertain' : 'sent',
                replyId: uuid(sequence++),
                error: lostReply.value ? 'resource_unavailable' : null,
              };
            }
            replyAttempts.set(args.apiVersion, value);
            return envelope({ ...value });
          }
          if (command === 'list_replies')
            return envelope({
              offset: args.offset,
              totalCount: rows.length,
              replies: rows
                .slice(args.offset, args.offset + 20)
                .map((item, index) => ({ replyId: uuid(900 + args.offset + index), caseId: item.caseId })),
            });
          if (command === 'load_event_log') {
            eventSnapshot = null;
            const active = { apiVersion: api.value, sessionId: sessionId(), environment: 'TEST' };
            if (delayedEvents.value)
              await new Promise((resolve) => {
                finishEventRead = resolve;
              });
            if (failEvents.value) throw 'verification_failed';
            eventSnapshot = {
              logId: uuid(sequence++),
              destinationId: args.destinationId,
              caseId: args.caseId,
              submissionId: args.submissionId,
              total: eventDocuments.length,
              warnings: ['CONTENT_AUTHENTICATION_TAGS_NOT_COMPARED'],
            };
            return { ...active, data: { ...eventSnapshot } };
          }
          if (['list_event_log', 'read_event_log', 'discard_event_log'].includes(command)) {
            if (!eventSnapshot || eventSnapshot.logId !== args.logId) throw 'invalid_resource';
            if (command === 'discard_event_log') {
              eventSnapshot = null;
              return envelope({ logId: args.logId });
            }
            if (command === 'list_event_log')
              return envelope({
                logId: args.logId,
                offset: args.offset,
                total: eventDocuments.length,
                events: eventDocuments
                  .slice(args.offset, args.offset + 5)
                  .map(({ header, claims, ...row }) => ({
                    ...row,
                    headerBytes: new TextEncoder().encode(header).length,
                    claimsBytes: new TextEncoder().encode(claims).length,
                  })),
              });
            const event = eventDocuments.find((item) => item.eventId === args.eventId);
            if (!event || !['header', 'claims'].includes(args.part)) throw 'invalid_resource';
            const bytes = new TextEncoder().encode(event[args.part]),
              chunk = bytes.slice(args.byteOffset, args.byteOffset + 24576);
            return envelope({
              logId: args.logId,
              eventId: args.eventId,
              part: args.part,
              byteOffset: args.byteOffset,
              totalBytes: bytes.length,
              chunk: btoa(String.fromCharCode(...chunk)),
              complete: args.byteOffset + chunk.length === bytes.length,
            });
          }
          if (command === 'loaded_keys')
            return envelope({
              keys: [
                { destinationId: destination, kid: 'synthetic-sign', purpose: 'sign' },
                ...(multipleKeys.value
                  ? [{ destinationId: destination, kid: 'synthetic-second-sign', purpose: 'sign' }]
                  : []),
              ],
            });
          if (command === 'receipt_state') return envelope({ ...receipt });
          if (command === 'prepare_receipt') {
            const draft = JSON.parse(args.receiptDocument);
            if (draft.action === 'accept' && (!proof || draft.proofId !== proof.proofId))
              throw 'verification_failed';
            signedReceipts.value++;
            receipt = {
              attemptId: uuid(sequence++),
              status: 'prepared',
              action: draft.action,
              destinationId: draft.destinationId,
              submissionId: draft.submissionId,
              caseId: draft.caseId,
              signingKid: draft.signingKid,
              error: null,
            };
            receipts.set(args.apiVersion, receipt);
            return envelope({
              attempt: { ...receipt },
              reason: draft.reason,
              description: draft.description,
              attachmentId: draft.attachmentId,
              warnings: draft.action === 'accept' ? [...proof.warnings] : [],
            });
          }
          if (command === 'cancel_receipt' || command === 'execute_receipt') {
            if (receipt.status !== 'prepared' || args.attemptId !== receipt.attemptId) throw 'send_locked';
            if (command === 'cancel_receipt') receipt = { ...receipt, status: 'cancelled' };
            else {
              sentReceipts.value++;
              receipt = {
                ...receipt,
                status: lostReceipt.value ? 'uncertain' : 'confirmed',
                error: lostReceipt.value ? 'resource_unavailable' : null,
              };
              proof = null;
            }
            receipts.set(args.apiVersion, receipt);
            return envelope({ ...receipt });
          }
          if (command === 'list_submissions') {
            proof = null;
            return envelope({
              offset: args.offset,
              totalCount: rows.length,
              submissions: rows.slice(args.offset, args.offset + 20),
            });
          }
          if (command === 'load_submission') {
            proof = null;
            const row = rows.find((item) => item.submissionId === args.submissionId);
            if (!row) throw 'resource_missing';
            return envelope({
              ...row,
              fromDestinationId: api.value === 'v3' ? uuid(300) : null,
              attachments: [uuid(400), uuid(401)],
              serviceIdentifier: 'urn:de:fim:leika:leistung:99008001014002',
              serviceName: 'Synthetische Leistung <em>Text bleibt Text</em>',
              region: 'DE000000000000',
              processModelId: api.value === 'v3' ? 'urn:test:process' : null,
              messageId: api.value === 'v3' ? 'request' : null,
              metadataAvailable: true,
              dataAvailable: true,
            });
          }
          if (command === 'verify_reply') {
            replyProof = null;
            proof = null;
            if (failVerification.value) throw 'verification_failed';
            replyProof = {
              proofId: uuid(sequence++),
              replyId: args.replyId,
              caseId: args.caseId,
              channelAttemptId: uuid(800),
              senderDestinationId: api.value === 'v3' ? uuid(1) : null,
              partCount: descriptions.length,
              warningCount: 1,
              warnings: ['MALWARE_SCAN_NOT_CONFIGURED'],
            };
            return envelope(replyProof);
          }
          if (
            [
              'list_received_reply_contents',
              'read_received_reply_content',
              'discard_received_reply',
            ].includes(command)
          ) {
            if (!replyProof || args.proofId !== replyProof.proofId) throw 'invalid_resource';
            if (command === 'discard_received_reply') {
              replyProof = null;
              return envelope({ proofId: args.proofId });
            }
            if (command === 'list_received_reply_contents')
              return envelope({
                proofId: replyProof.proofId,
                offset: args.offset,
                total: descriptions.length,
                parts: descriptions
                  .slice(args.offset, args.offset + 2)
                  .map(({ source, bytes, ...part }) => ({ ...part, totalBytes: bytes.length })),
              });
            const part = descriptions.find((item) => item.contentId === args.contentId);
            if (!part) throw 'invalid_resource';
            const bytes = part.bytes.slice(args.byteOffset, args.byteOffset + 24576);
            return envelope({
              proofId: replyProof.proofId,
              contentId: args.contentId,
              byteOffset: args.byteOffset,
              totalBytes: part.bytes.length,
              chunk: btoa(String.fromCharCode(...bytes)),
              complete: args.byteOffset + bytes.length === part.bytes.length,
            });
          }
          if (command === 'verify_submission') {
            proof = null;
            replyProof = null;
            if (failVerification.value) throw 'verification_failed';
            proof = {
              proofId: uuid(sequence++),
              destinationId: destination,
              submissionId: args.submissionId,
              caseId: rows.find((item) => item.submissionId === args.submissionId).caseId,
              partCount: descriptions.length,
              warningCount: 1,
              warnings: ['MALWARE_SCAN_NOT_CONFIGURED'],
            };
            return envelope(proof);
          }
          if (['list_received_contents', 'read_received_content', 'discard_received'].includes(command)) {
            if (!proof || args.proofId !== proof.proofId) throw 'invalid_resource';
            if (command === 'discard_received') {
              proof = null;
              return envelope({ proofId: args.proofId });
            }
            if (command === 'list_received_contents')
              return envelope({
                proofId: proof.proofId,
                offset: args.offset,
                total: descriptions.length,
                parts: descriptions
                  .slice(args.offset, args.offset + 2)
                  .map(({ source, bytes, ...part }) => ({ ...part, totalBytes: bytes.length })),
              });
            const part = descriptions.find((item) => item.contentId === args.contentId);
            if (!part) throw 'invalid_resource';
            const bytes = part.bytes.slice(args.byteOffset, args.byteOffset + 24 * 1024);
            return envelope({
              proofId: proof.proofId,
              contentId: args.contentId,
              byteOffset: args.byteOffset,
              totalBytes: part.bytes.length,
              chunk: btoa(String.fromCharCode(...bytes)),
              complete: args.byteOffset + bytes.length === part.bytes.length,
            });
          }
          if (command === 'begin_content') {
            const value = {
              contentId: uuid(sequence++),
              totalBytes: args.totalBytes,
              receivedBytes: 0,
              complete: args.totalBytes === 0,
            };
            staged.set(value.contentId, value);
            return envelope({ ...value });
          }
          if (command === 'append_content') {
            const value = staged.get(args.contentId);
            if (!value || value.receivedBytes !== args.byteOffset) throw 'invalid_input';
            value.receivedBytes += atob(args.chunk).length;
            value.complete = value.receivedBytes === value.totalBytes;
            return envelope({ ...value });
          }
          if (command === 'discard_content') {
            staged.delete(args.contentId);
            return envelope({ contentId: args.contentId });
          }
          throw 'engine_protocol_error';
        },
      };
      createApp({
        setup() {
          return () =>
            h('main', { class: 'page client-page' }, [
              h('section', { class: 'tool-section' }, [
                h('h1', 'Einreichungssuche · synthetische UI-Testdaten'),
                h('p', 'Keine FIT-Connect-Verbindung.'),
                h('div', { class: 'client-actions' }, [
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      onClick: () =>
                        (document.documentElement.dataset.theme =
                          document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'),
                    },
                    'Theme wechseln',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (api.value = api.value === 'v3' ? 'v2' : 'v3'),
                    },
                    'API wechseln',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (failVerification.value = !failVerification.value),
                    },
                    failVerification.value ? 'Prüfung wieder erfolgreich' : 'Prüffehler simulieren',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => {
                        proof = null;
                        keyRevision.value++;
                      },
                    },
                    'Schlüsselverwerfen simulieren',
                  ),
                ]),
                h('div', { class: 'client-actions' }, [
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (eventVisible.value = !eventVisible.value),
                    },
                    eventVisible.value ? 'Zurück zu Einreichungen' : 'Event Log öffnen',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (failEvents.value = !failEvents.value),
                    },
                    failEvents.value ? 'Event Log wieder erfolgreich' : 'Event-Log-Fehler simulieren',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (delayedEvents.value = !delayedEvents.value),
                    },
                    delayedEvents.value ? 'Event Log wieder sofort laden' : 'Event Log verzögern',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      onClick: () => {
                        api.value = api.value === 'v3' ? 'v2' : 'v3';
                        finishEventRead?.();
                        finishEventRead = null;
                      },
                    },
                    'Kontext wechseln und Abruf freigeben',
                  ),
                ]),
                h('div', { class: 'client-actions' }, [
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (multipleKeys.value = !multipleKeys.value),
                    },
                    multipleKeys.value ? 'Ein Signaturschlüssel' : 'Mehrere Signaturschlüssel',
                  ),
                  h(
                    'button',
                    {
                      class: 'button secondary',
                      disabled: busy.value,
                      onClick: () => (lostReceipt.value = !lostReceipt.value),
                    },
                    lostReceipt.value ? 'Antwort wieder bestätigen' : 'Ungewisse Antwort simulieren',
                  ),
                ]),
                h(
                  'button',
                  {
                    class: 'button secondary',
                    disabled: busy.value,
                    onClick: () => (lostReply.value = !lostReply.value),
                  },
                  lostReply.value ? 'Reply wieder bestätigen' : 'Ungewissen Reply simulieren',
                ),
                h(
                  'p',
                  { role: 'status' },
                  `${api.value} · ${activity.value} · Signiert: ${signedReceipts.value} · Gesendet: ${sentReceipts.value} · Replies: ${repliesSent.value}`,
                ),
              ]),
              h(SubmissionBrowser, {
                session: {
                  apiVersion: api.value,
                  sessionId: sessionId(),
                  environment: 'TEST',
                  connected: true,
                  role: 'administrative-system',
                },
                style: { display: eventVisible.value ? 'none' : '' },
                busy: busy.value,
                destinationId: destination,
                keyRevision: keyRevision.value,
                receiveRevision: submissionRevision.value,
                onReceiveStart: () => replyRevision.value++,
                onBusy: (value) => (busy.value = value),
                onEventLog: (value) => {
                  eventTarget.value = { ...value, requestId: uuid(sequence++) };
                  eventVisible.value = true;
                },
                onActivity: (event) => (activity.value = `${event.action}: ${event.status}`),
              }),
              h(EventLogPanel, {
                session: {
                  apiVersion: api.value,
                  sessionId: sessionId(),
                  environment: 'TEST',
                  connected: true,
                  role: 'administrative-system',
                },
                busy: busy.value,
                target: eventTarget.value,
                visible: eventVisible.value,
                style: { display: eventVisible.value ? '' : 'none' },
                onBusy: (value) => (busy.value = value),
                onActivity: (event) => (activity.value = `${event.action}: ${event.status}`),
              }),
              h(ReplyBrowser, {
                session: {
                  apiVersion: api.value,
                  sessionId: sessionId(),
                  environment: 'TEST',
                  connected: true,
                  role: 'online-service',
                },
                busy: busy.value,
                keyRevision: keyRevision.value,
                receiveRevision: replyRevision.value,
                onReceiveStart: () => submissionRevision.value++,
                style: { display: eventVisible.value ? 'none' : '' },
                onBusy: (value) => (busy.value = value),
                onActivity: (event) => (activity.value = `${event.action}: ${event.status}`),
              }),
            ]);
        },
      }).mount('#app');
    </script>
  </body>
</html>
