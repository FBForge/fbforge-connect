<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Fiktive lokale Sitzungsaktionen</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref } from 'vue/dist/vue.esm-bundler.js';
      import ScenarioWorkspace from '../src/integration/scenarios/ScenarioWorkspace.vue';
      import { testLibraryFixture } from './test-library-fixture.js';
      import ApplicationClose from '../src/app/ApplicationClose.vue';
      import NetworkSettings from '../src/app/NetworkSettings.vue';
      import '../src/styles/index.css';
      const callbacks = new Map();
      const listeners = new Map();
      window.isTauri = true;
      window.__lifecycle = {
        calls: [],
        busy: false,
        fail: false,
        nativeClose: () => {
          const callback = listeners.get('application-close-requested');
          if (!callback) throw new Error('native close listener missing');
          callbacks.get(callback)({ event: 'application-close-requested', id: callback, payload: null });
        },
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: (event) => listeners.delete(event),
      };
      window.__TAURI_INTERNALS__ = {
        transformCallback: (callback) => {
          const id = callbacks.size + 1;
          callbacks.set(id, callback);
          return id;
        },
        invoke: async (command, args) => {
          const fixture = window.__lifecycle;
          fixture.calls.push({ command, args });
          if (command === 'plugin:event|listen') {
            listeners.set(args.event, args.handler);
            return args.handler;
          }
          if (command === 'test_library') return testLibraryFixture(args.request);
          if (command === 'network_settings') {
            if (new URLSearchParams(location.search).has('holdNetwork'))
              await new Promise((resolve) => (fixture.finishNetworkRead = resolve));
            if (new URLSearchParams(location.search).has('failNetwork')) throw 'network_invalid';
            return {
              mode: 'manual',
              host: 'proxy.example.de',
              port: 8080,
              username: 'proxy-user',
              hasPassword: true,
            };
          }
          if (command === 'close_application' && fixture.fail) throw 'vault_pending';
          if (command === 'save_network_settings') return null;
          return null;
        },
      };
      createApp({
        components: { ApplicationClose, NetworkSettings, ScenarioWorkspace },
        setup() {
          const close = ref(null),
            busy = ref(false);
          window.__lifecycle.setBusy = (value) => (busy.value = value);
          return { close, busy, preparation: new URLSearchParams(location.search).has('preparation') };
        },
        template: `<main><h1>Lokale Sitzung</h1><button @click="close.requestClose()">Fenster schließen</button><ApplicationClose ref="close" :busy="busy" :active="true"/><NetworkSettings v-if="!preparation" :busy="busy"/><ScenarioWorkspace v-else :session="null" :busy="busy"/></main>`,
      }).mount('#app');
    </script>
  </body>
</html>
