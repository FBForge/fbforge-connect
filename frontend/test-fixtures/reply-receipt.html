<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Antwortquittierung · synthetische Testdaten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref, h } from 'vue';
      import ReplyReceiptPanel from '../src/ReplyReceiptPanel.vue';
      import EventLogPanel from '../src/EventLogPanel.vue';
      import '../src/styles/index.css';
      import '../src/styles/index.css';
      import '../src/styles/index.css';
      const id = (n) => `11111111-1111-4111-8111-${String(n).padStart(12, '0')}`;
      const session = {
        apiVersion: new URLSearchParams(location.search).get('api') === 'v2' ? 'v2' : 'v3',
        sessionId: id(1),
        environment: 'TEST',
        role: 'online-service',
        connected: true,
      };
      const detail = { caseId: id(2), replyId: id(3) };
      const initial = {
        proofId: id(4),
        ...detail,
        warnings: [
          new URLSearchParams(location.search).has('blocked')
            ? 'MALWARE_ATTACHMENT_BLOCKED'
            : 'MALWARE_SCAN_NOT_CONFIGURED',
        ],
      };
      const fixture = (window.__receiptFixture = {
        writes: 0,
        cancels: 0,
        state: {
          attemptId: null,
          status: 'idle',
          caseId: null,
          replyId: null,
          action: null,
          eventId: null,
          error: null,
        },
        uncertain: false,
        delay: false,
        release: null,
      });
      const envelope = (data) => ({
        apiVersion: session.apiVersion,
        sessionId: session.sessionId,
        environment: 'TEST',
        data,
      });
      window.__TAURI_INTERNALS__ = {
        async invoke(command, args) {
          if (command === 'reply_receipt_state') return envelope(fixture.state);
          if (command === 'prepare_reply_receipt') {
            const draft = JSON.parse(args.receiptDocument);
            fixture.lastDraft = draft;
            if (fixture.delay) await new Promise((resolve) => (fixture.release = resolve));
            fixture.state = {
              attemptId: id(5),
              status: 'prepared',
              caseId: draft.caseId,
              replyId: draft.replyId,
              action: draft.action,
              eventId: null,
              error: null,
            };
            return envelope({
              attempt: fixture.state,
              reason: draft.reason,
              description: draft.description,
              attachmentId: draft.attachmentId,
              warnings: draft.action === 'accept' ? initial.warnings : [],
            });
          }
          if (command === 'cancel_reply_receipt') {
            fixture.cancels++;
            fixture.state = { ...fixture.state, status: 'cancelled' };
            return envelope(fixture.state);
          }
          if (command === 'execute_reply_receipt') {
            fixture.writes++;
            fixture.state = {
              ...fixture.state,
              status: fixture.uncertain ? 'uncertain' : 'confirmed',
              eventId: fixture.uncertain ? null : id(6),
              error: fixture.uncertain ? 'resource_unavailable' : null,
            };
            return envelope(fixture.state);
          }
          if (command === 'load_reply_event_log')
            return envelope({
              logId: id(7),
              ...detail,
              total: 1,
              warnings: ['CONTENT_AUTHENTICATION_TAGS_NOT_COMPARED'],
            });
          if (command === 'load_case_event_log')
            return envelope({
              logId: id(7),
              caseId: detail.caseId,
              scope: 'case',
              total: 1,
              warnings: ['CONTENT_AUTHENTICATION_TAGS_NOT_COMPARED'],
            });
          if (command === 'list_event_log' || command === 'list_case_event_log')
            return envelope({
              logId: id(7),
              offset: 0,
              total: 1,
              events: [
                {
                  eventId: id(6),
                  eventType: 'https://schema.fitko.de/fit-connect/events/accept-reply',
                  issuer: 'https://test.fit-connect.fitko.dev/submission-api',
                  issuedAt: '2026-10-16T12:00:00Z',
                  headerBytes: 2,
                  claimsBytes: 2,
                  ...(command === 'list_case_event_log'
                    ? { subjectType: 'reply', subjectId: detail.replyId }
                    : {}),
                },
              ],
            });
          if (command === 'discard_event_log') return envelope({ logId: args.logId });
          throw 'invalid_input';
        },
      };
      createApp({
        setup() {
          const busy = ref(false),
            proof = ref(initial),
            target = ref(null);
          fixture.invalidate = () => (proof.value = null);
          return () =>
            h('main', { class: 'workspace-content' }, [
              h('p', 'SYNTHETISCHE TESTDATEN · keine FIT-Connect-Verbindung'),
              h(ReplyReceiptPanel, {
                session,
                detail,
                proof: proof.value,
                parts: [],
                busy: busy.value,
                onBusy: (value) => (busy.value = value),
                onInvalidate: () => (proof.value = null),
                onEventLog: (value) => (target.value = value),
              }),
              h(EventLogPanel, {
                session,
                busy: busy.value,
                target: target.value,
                visible: true,
                onBusy: (value) => (busy.value = value),
              }),
            ]);
        },
      }).mount('#app');
    </script>
  </body>
</html>
