<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile · synthetische Testdaten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from 'vue';
      import App from '../src/App.vue';
      import '../src/site.css';
      import '../src/layout.css';
      import '../src/desktop.css';
      import '../src/application-view.css';
      const id = (n) => `11111111-1111-4111-8111-${String(n).padStart(12, '0')}`;
      const fixture = (window.__profilesFixture = {
        profiles: [],
        defaults: {},
        sequence: 10,
        calls: [],
        active: null,
        binding: null,
        failRestore: false,
        failSave: false,
        backups: 0,
        failSecret: false,
      });
      const session = () => ({
        sessionId: id(++fixture.sequence),
        apiVersion: 'v3',
        role: 'online-service',
        environment: 'TEST',
        connected: true,
      });
      window.isTauri = true;
      window.__TAURI_INTERNALS__ = {
        async invoke(command, args = {}) {
          fixture.calls.push({ command, args });
          if (command === 'list_profiles') return fixture.profiles;
          if (command === 'get_profile_defaults')
            return fixture.binding
              ? fixture.defaults[fixture.binding] || { sourceDestination: null, receiverDestination: null }
              : null;
          if (command === 'save_profile_defaults') {
            if (!fixture.binding) throw 'vault_profile_required';
            if (fixture.failSave) throw 'vault_unavailable';
            fixture.defaults[fixture.binding] = structuredClone(args.defaults);
            return structuredClone(args.defaults);
          }

          if (command === 'open_session') {
            fixture.active = session();
            fixture.binding = args.profileId || null;
            if (args.profileId)
              fixture.profiles.push({
                profileId: args.profileId,
                name: args.profileName,
                apiVersion: 'v3',
                role: 'online-service',
                keyCount: 2,
                available: true,
              });
            return fixture.active;
          }
          if (command === 'export_profile_backup') {
            fixture.backups++;
            return true;
          }
          if (command === 'import_profile_backup' || command === 'import_profile_backup_file') {
            const profile = {
              profileId: id(3),
              name: 'Wiederhergestellt TEST',
              apiVersion: 'v3',
              role: 'online-service',
              keyCount: 2,
              available: true,
            };
            fixture.profiles.push(profile);
            return profile;
          }
          if (command === 'update_profile') {
            if (fixture.failSecret) throw 'authentication_failed';
            const profile = fixture.profiles.find((item) => item.profileId === args.profileId);
            profile.name = args.name;
            return profile;
          }
          if (command === 'profile_status')
            return {
              profileId: fixture.binding,
              saved: Boolean(fixture.binding) && !fixture.failSave,
              error: fixture.binding && fixture.failSave ? 'vault_unavailable' : null,
            };
          if (command === 'check_session') return fixture.active;
          if (command === 'close_session') {
            const result = { ...fixture.active, connected: false };
            fixture.active = null;
            fixture.binding = null;
            return result;
          }
          if (command === 'open_saved_profile') {
            if (fixture.failRestore && args.restoreKeys) throw 'vault_restore_failed';
            fixture.active = session();
            fixture.binding = args.restoreKeys ? args.profileId : null;
            return fixture.active;
          }
          if (command === 'forget_profile') {
            fixture.profiles = fixture.profiles.filter((item) => item.profileId !== args.profileId);
            fixture.binding = null;
            return null;
          }
          if (command === 'save_profile_state') {
            fixture.failSave = false;
            return null;
          }
          throw 'resource_denied';
        },
      };
      createApp(App).mount('#app');
    </script>
  </body>
</html>
