<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schlüsselinventar · synthetische Testdaten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref, h } from 'vue';
      import KeyInventory from '../src/KeyInventory.vue';
      import '../src/styles/index.css';
      import '../src/styles/index.css';
      import '../src/styles/index.css';
      const id = (n) => `11111111-1111-4111-8111-${String(n).padStart(12, '0')}`;
      const state = (window.__inventory = {
        removals: [],
        changed: 0,
        failSave: false,
        rows: [
          {
            itemId: id(10),
            kind: 'reply',
            purpose: 'reply',
            keyId: `reply-key:${id(10)}`,
            destinationId: id(2),
            caseId: id(3),
            status: 'bound',
            fingerprint: 'a'.repeat(64),
            expiresAt: null,
            removable: true,
            blockedReason: null,
          },
          {
            itemId: id(11),
            kind: 'generated',
            purpose: 'decrypt+sign',
            keyId: 'pair-unresolved',
            destinationId: id(2),
            caseId: null,
            status: 'unresolved',
            fingerprint: 'b'.repeat(64) + ' / ' + 'c'.repeat(64),
            expiresAt: '2027-01-01T00:00:00Z',
            removable: false,
            blockedReason: 'unresolved_operation',
          },
        ],
      });
      window.__TAURI_INTERNALS__ = {
        async invoke(command, args) {
          if (command === 'remove_key_inventory_item') {
            if (state.failSave) throw 'vault_unavailable';
            state.removals.push(args.itemId);
            state.rows = state.rows.filter((row) => row.itemId !== args.itemId);
          } else if (command !== 'list_key_inventory') throw 'resource_denied';
          return {
            apiVersion: 'v3',
            sessionId: args.sessionId,
            environment: 'TEST',
            data: { offset: 0, total: state.rows.length, items: state.rows },
          };
        },
      };
      createApp({
        components: { KeyInventory },
        setup() {
          const busy = ref(false),
            session = ref({ apiVersion: 'v3', sessionId: id(1), environment: 'TEST', connected: true });
          window.__switchInventorySession = () => {
            session.value = { ...session.value, sessionId: id(99) };
          };
          return () =>
            h('main', [
              h('h1', 'Schlüsselbestand'),
              h(KeyInventory, {
                session: session.value,
                busy: busy.value,
                onBusy: (value) => {
                  busy.value = value;
                },
                onInvalidate: () => {
                  state.changed++;
                },
              }),
            ]);
        },
      }).mount('#app');
    </script>
  </body>
</html>
